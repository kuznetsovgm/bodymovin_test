version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: bodymovin-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - bodymovin-net

  postgres:
    image: postgres:15-alpine
    container_name: bodymovin-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${PG_USER:-postgres}
      - POSTGRES_PASSWORD=${PG_PASSWORD:-postgres}
      - POSTGRES_DB=${PG_DB:-postgres}
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bodymovin-net

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bodymovin-bot
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - BOT_TOKEN=${BOT_TOKEN}
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:-postgres}
      - PG_PASSWORD=${PG_PASSWORD:-postgres}
      - PG_DB=${PG_DB:-postgres}
      - NODE_ENV=production
      - METRICS_PORT=${METRICS_PORT:-3099}
      - LOKI_HOST=${LOKI_HOST:-http://loki:3100}
      - ENABLE_LOKI=${ENABLE_LOKI:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ADMIN_USER_IDS=${ADMIN_USER_IDS}
      - UPLOAD_CHAT_IDS=${UPLOAD_CHAT_IDS}
      - WORKER_POOL_SIZE=${WORKER_POOL_SIZE:-4}
      - WORKER_QUEUE_SIZE=${WORKER_QUEUE_SIZE:-100}
    volumes:
      - ./stickers:/app/stickers
      - ./temp:/app/temp
      - ./public:/app/public
      - ./fonts:/app/fonts
    ports:
      - "127.0.0.1:3099:3099"
    command: node -r dotenv/config ./dist/bot.js
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3099/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      bodymovin-net:
      quickqueue-shared:
        aliases:
          - bodymovin-bot
          - bot
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=3099"
      - "prometheus.path=/metrics"

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: bodymovin-redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "127.0.0.1:9121:9121"
    networks:
      bodymovin-net:
      quickqueue-shared:
        aliases:
          - bodymovin-redis-exporter
          - redis-exporter
    depends_on:
      - redis
      - postgres

  config-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bodymovin-config-ui
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - WEB_PORT=8080
      - REDIS_URL=redis://redis:6379
      - CONFIG_UI_SECRET_PATH=${CONFIG_UI_SECRET_PATH:-/}
    command: node -r dotenv/config ./dist/web-server.js
    volumes:
      - ./public:/app/public
      - ./fonts:/app/fonts
    ports:
      - "127.0.0.1:8088:8080"
    networks:
      - bodymovin-net

networks:
  bodymovin-net:
    driver: bridge
  quickqueue-shared:
    external: true
    name: quickqueue-shared

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
